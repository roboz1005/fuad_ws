# =============================================================================
# ROS 2 parameters file for integration_pkg
# All topics match Gazebo Harmonic + ros_gz_bridge conventions
# =============================================================================

/**:
  ros__parameters:
    # -------------------------------------------------------------------------
    # SPAWN POSITIONS
    # -------------------------------------------------------------------------
    spawn_turtlebot3_x: -2.0
    spawn_turtlebot3_y: -2.0
    spawn_turtlebot3_z: 0.01
    spawn_turtlebot3_yaw: 0.0
    spawn_quadcopter_x: 0.0
    spawn_quadcopter_y: 0.0
    spawn_quadcopter_z: 0.5
    spawn_quadcopter_yaw: 0.0

    # -------------------------------------------------------------------------
    # FOLLOW CONTROLLER GAINS
    # -------------------------------------------------------------------------
    kp_linear: 0.5
    kp_angular: 1.0
    max_linear: 0.22
    max_angular: 2.84
    follow_distance: 1.5
    avoidance_distance: 0.35

    # -------------------------------------------------------------------------
    # TOPIC NAMES — matched to Gazebo Harmonic bridge topics
    # -------------------------------------------------------------------------
    # Quadcopter (model name = X3)
    drone_cmd_vel_topic: "/model/X3/cmd_vel"
    drone_odom_topic: "/model/X3/odometry"
    drone_camera_topic: "/world/default/model/X3/link/camera_link/sensor/camera/image"
    drone_battery_topic: "/drone/battery"

    # TurtleBot3 (model name = turtlebot3)
    tb3_cmd_vel_topic: "/model/turtlebot3/cmd_vel"
    tb3_odom_topic: "/model/turtlebot3/odometry"
    tb3_scan_topic: "/model/turtlebot3/scan"

    # Control arbitration
    manual_cmd_topic: "/manual_cmd"
    voice_cmd_topic: "/voice_cmd"
    mode_topic: "/control/mode"
    set_mode_service: "/command_selector/set_mode"

    # -------------------------------------------------------------------------
    # VOICE COMMAND MAPPING (Twist values)
    # -------------------------------------------------------------------------
    voice_forward_linear_x: 1.0
    voice_forward_linear_y: 0.0
    voice_forward_linear_z: 0.0
    voice_forward_angular_z: 0.0

    voice_backward_linear_x: -1.0
    voice_backward_linear_y: 0.0
    voice_backward_linear_z: 0.0
    voice_backward_angular_z: 0.0

    voice_left_linear_x: 0.0
    voice_left_linear_y: 0.0
    voice_left_linear_z: 0.0
    voice_left_angular_z: 1.0

    voice_right_linear_x: 0.0
    voice_right_linear_y: 0.0
    voice_right_linear_z: 0.0
    voice_right_angular_z: -1.0

    voice_up_linear_x: 0.0
    voice_up_linear_y: 0.0
    voice_up_linear_z: 1.0
    voice_up_angular_z: 0.0

    voice_down_linear_x: 0.0
    voice_down_linear_y: 0.0
    voice_down_linear_z: -1.0
    voice_down_angular_z: 0.0

    voice_stop_linear_x: 0.0
    voice_stop_linear_y: 0.0
    voice_stop_linear_z: 0.0
    voice_stop_angular_z: 0.0